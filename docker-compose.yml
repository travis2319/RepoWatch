services:
  frontend:
    build:
      context: ./FRONTEND
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Example: tell frontend where backend is
      VITE_API_URL: http://backend:4000
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      APP_ENV: ${APP_ENV}
      APP_PORT: ${APP_PORT}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - ./BACKEND:/app   # Mount local source for live edits
    command: go run cmd/main.go
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
