services:
  backend:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    container_name: repo-watch-backend
    ports:
      - "4000:4000"
    env_file:
      - .env       # your GITHUB_TOKEN and other env vars
    environment:
      - APP_ENV=development
      - APP_PORT=4000
    volumes:
      - ./BACKEND:/app  # optional: for live edits in development
    command: go run cmd/main.go
    restart: unless-stopped
